# ===========================================================================
# Precedent Gold Set
#
# Grounded in the eight-document pilot corpus. Every expectation below traces
# to language actually present in a source -- no invented facts.
#
# Covers: MATCH / PARTIAL_MATCH / NO_PRECEDENT
#         CURRENT / SUPERSEDED / UNDER_REVIEW / UNKNOWN / null
#         ANSWER / ANSWER_WITH_TAX_REVIEW / ABSTAIN
#
# Validate with:  python eval/runners/validate_gold_set.py --coverage
#
# ---------------------------------------------------------------------------
# IMPORTANT - two entity universes
#
# The corpus contains two unrelated groups. Several cases below exist purely to
# test that the system does NOT bridge them:
#
#   Amsted Industries  -> ADS.pdf, Malaysia OECD.pdf, Netherlands SARS.pdf
#                         (ADS, Transquip, BAC, BAC Malaysia, ConMet)
#   Northline (NIH)    -> SRC-002, SRC-005, SRC-010, SRC-020, SRC-021
#                         (Meridian Bearing, Cascade Forge, Northline Canada ULC)
#
# ---------------------------------------------------------------------------
# SOURCE ID MAPPING - verify before use
#
#   SRC-002  SRC-002_Email_Thread_2024_LTIP_409p_Synthetic_Equity.eml
#   SRC-005  SRC-005_Email_Thread_Illinois_Nexus_MBC_FINAL_POSITION.eml
#   SRC-010  SRC-010_Email_Thread_Northline_Canada_Reg105_Services_PE_OPEN.eml
#   SRC-020  SRC-020_Email_Thread_RD_Credit_Foundry_Alloy_Trials.eml
#   SRC-021  SRC-021_Email_Admin_Shared_Drive_Migration_NOISE.eml
#   SRC-001  ADS.pdf                 <- ID ASSIGNED HERE, confirm against index
#   SRC-030  Malaysia OECD.pdf       <- ID ASSIGNED HERE, confirm against index
#   SRC-031  Netherlands SARS.pdf    <- ID ASSIGNED HERE, confirm against index
#
# Confirm with:  python scripts/smoke_search.py -q "..." --show-ids
# ===========================================================================

version: 2
index_schema_version: "1.0.0"
corpus: amsted-pilot-8doc

cases:

  # =======================================================================
  # MATCH -- same issue, same entity, same jurisdiction, same facts
  # =======================================================================

  - test_id: GS-M-001
    question: >-
      What concerns did Amsted identify about ADS sending Transquip service
      technicians into a major city with an income tax?
    tags: [match, salt, nexus, amsted, milestone-1]
    notes: >-
      MILESTONE 1 TARGET. Squarely on point with SRC-001. The source states the
      concern directly: one ADS service job can trigger income tax on other
      Amsted members because many state/city jurisdictions view the whole group
      as one entity.
    expected_intent: HISTORICAL_PRECEDENT
    expected_source_ids: ["SRC-001"]
    expected_precedent_status: MATCH
    expected_validity_status: UNKNOWN
    expected_evidence_sufficiency: SUFFICIENT
    expected_external_research_required: false
    expected_response_action: ANSWER_WITH_TAX_REVIEW
    expected_material_similarities:
      - "ADS service activity performed by Transquip technicians"
      - "Group-wide income tax exposure from single-member presence"
    expected_material_differences: []
    validity_rationale_must_reference: >-
      Source is dated February 2021 and contains no later confirmation. Corpus
      does not establish present validity, so UNKNOWN is correct. CURRENT would
      be a false-CURRENT failure.
    expected_provenance_fields: [source_id, page_number]

  - test_id: GS-M-002
    question: >-
      Did Meridian Bearing Company have Illinois income tax nexus for 2019
      through 2021, and does P.L. 86-272 protect it?
    tags: [match, salt, nexus, pl86-272, northline]
    notes: >-
      SRC-005 is explicitly labelled FINAL POSITION and answers both halves
      directly. Strongest MATCH + CURRENT case in the corpus.
    expected_intent: HISTORICAL_PRECEDENT
    expected_source_ids: ["SRC-005"]
    expected_precedent_status: MATCH
    expected_validity_status: CURRENT
    expected_evidence_sufficiency: SUFFICIENT
    expected_external_research_required: false
    expected_response_action: ANSWER
    expected_material_similarities:
      - "Meridian Bearing Company, Illinois, tax years 2019-2021"
      - "Field service and warranty repair at customer rail yards"
    expected_material_differences: []
    validity_rationale_must_reference: >-
      CURRENT is affirmatively supported: the thread states 'treat this as the
      final position for IL' and records a decision to enter the Illinois
      voluntary disclosure program. This is evidence OF currency, not absence of
      contradiction.
    expected_answer_must_contain:
      - "P.L. 86-272 does not protect"
      - "field service"
    expected_provenance_fields: [source_id, message_id, sender, sent_date]

  - test_id: GS-M-003
    question: >-
      What R&D credit amount did we conclude we should file for the foundry
      alloy trial program?
    tags: [match, rd-credit, northline]
    notes: >-
      SRC-020 states the recommendation plainly: file at $438,000, down from the
      $612,000 draft, after backing out supplies tied to saleable output.
    expected_intent: HISTORICAL_PRECEDENT
    expected_source_ids: ["SRC-020"]
    expected_precedent_status: MATCH
    expected_validity_status: CURRENT
    expected_evidence_sufficiency: SUFFICIENT
    expected_external_research_required: false
    expected_response_action: ANSWER
    expected_material_similarities:
      - "2020-2021 alloy trial program at Cascade Forge"
    expected_answer_must_contain: ["438,000"]

  # =======================================================================
  # PARTIAL_MATCH -- relevant guidance, material fact differs
  # =======================================================================

  - test_id: GS-P-001
    question: >-
      Can ADS perform a service job in Philadelphia without creating broader tax
      exposure for Amsted?
    tags: [partial_match, salt, nexus, jurisdiction-difference, critical]
    notes: >-
      CRITICAL REGRESSION CASE. SRC-001 uses New York City as its worked example;
      the question asks about Philadelphia. The reasoning transfers, the
      jurisdiction does not. If retrieval hard-filters jurisdiction this returns
      nothing and the system collapses to NO_PRECEDENT.
    expected_intent: CURRENT_TAX_QUESTION
    expected_source_ids: ["SRC-001"]
    expected_precedent_status: PARTIAL_MATCH
    expected_validity_status: UNKNOWN
    expected_evidence_sufficiency: INSUFFICIENT_FOR_CURRENT_CONCLUSION
    expected_external_research_required: true
    expected_response_action: ANSWER_WITH_TAX_REVIEW
    expected_material_similarities:
      - "ADS service activity in a city with a local income tax"
      - "Risk of group-wide exposure via single-member presence"
    expected_material_differences:
      - "Source addresses New York City; question addresses Philadelphia"
      - "Source is illustrative, not a Philadelphia-specific conclusion"
    expected_provenance_fields: [source_id, page_number]

  - test_id: GS-P-002
    question: >-
      Does Meridian Bearing have Wisconsin nexus given the Illinois conclusion?
    tags: [partial_match, salt, explicit-scope-limit, critical]
    notes: >-
      TRAP CASE. SRC-005 contains an explicit author instruction: 'we are NOT
      extending this conclusion to Wisconsin ... please do not let anyone cite
      this thread for a Wisconsin position.' The same thread separately concludes
      Wisconsin IS protected on different facts. A correct answer must honour the
      author's scope limitation rather than generalising the Illinois holding.
    expected_intent: HISTORICAL_PRECEDENT
    expected_source_ids: ["SRC-005"]
    expected_precedent_status: PARTIAL_MATCH
    expected_validity_status: CURRENT
    expected_evidence_sufficiency: SUFFICIENT
    expected_external_research_required: false
    expected_response_action: ANSWER_WITH_TAX_REVIEW
    expected_material_similarities:
      - "Same entity (Meridian Bearing) and same P.L. 86-272 framework"
    expected_material_differences:
      - "Wisconsin facts differ: no repair work, no in-state inventory, no WI-resident employee, orders routed to Texas"
      - "Thread explicitly forbids citing the Illinois conclusion for Wisconsin"
    expected_answer_must_contain: ["Wisconsin", "protected"]
    must_not_conclude: >-
      Must NOT state that Wisconsin has nexus by analogy to Illinois.

  - test_id: GS-P-003
    question: >-
      Does our foundry process engineering work qualify for the R&D credit
      generally?
    tags: [partial_match, rd-credit, explicit-scope-limit]
    notes: >-
      SRC-020 pre-empts exactly this over-generalisation: the conclusion 'is
      specific to the 2020 and 2021 alloy trial program at Cascade Forge. It does
      NOT establish that all foundry process work qualifies,' and notes the 2018
      refractory lining project was denied.
    expected_intent: HISTORICAL_PRECEDENT
    expected_source_ids: ["SRC-020"]
    expected_precedent_status: PARTIAL_MATCH
    expected_validity_status: CURRENT
    expected_evidence_sufficiency: INSUFFICIENT_FOR_CURRENT_CONCLUSION
    expected_external_research_required: false
    expected_response_action: ANSWER_WITH_TAX_REVIEW
    expected_material_differences:
      - "Precedent is limited to the 2020-2021 Cascade Forge alloy trials"
      - "2018 refractory lining project was denied for lack of documented process of experimentation"
    must_not_conclude: >-
      Must NOT state that foundry process work qualifies generally.

  - test_id: GS-P-004
    question: >-
      How should we handle SARs awards for two employees in Spain?
    tags: [partial_match, equity-comp, jurisdiction-difference, amsted]
    notes: >-
      SRC-031 addresses the Netherlands and states a general Amsted position for
      'miscellaneous country' awards -- run through local payroll, obtain written
      acknowledgement that awards are discretionary. Reasoning transfers; Spain
      specifics are absent.
    expected_intent: CURRENT_TAX_QUESTION
    expected_source_ids: ["SRC-031"]
    expected_precedent_status: PARTIAL_MATCH
    expected_validity_status: UNKNOWN
    expected_evidence_sufficiency: INSUFFICIENT_FOR_CURRENT_CONCLUSION
    expected_external_research_required: true
    expected_response_action: ANSWER_WITH_TAX_REVIEW
    expected_material_similarities:
      - "Small-population SARs award in a non-China, non-Mexico jurisdiction"
      - "General approach of routing cost to local payroll at the taxing moment"
    expected_material_differences:
      - "Source addresses the Netherlands; question addresses Spain"
      - "No Spain-specific analysis exists in the corpus"

  - test_id: GS-P-005
    question: >-
      If we send US employees on site to a customer in Mexico for several months,
      do we create a services permanent establishment?
    tags: [partial_match, international, explicit-scope-limit, northline]
    notes: >-
      SRC-010 analyses the Canada services-PE question under Article V(9) and
      explicitly warns the reader off exactly this transfer: 'this is materially
      different from the 2016 analysis we did for the Mexico technical services
      arrangement - different treaty, different mechanics. Do not let anyone cite
      that one here.'
    expected_intent: CURRENT_TAX_QUESTION
    expected_source_ids: ["SRC-010"]
    expected_precedent_status: PARTIAL_MATCH
    expected_validity_status: UNDER_REVIEW
    expected_evidence_sufficiency: INSUFFICIENT
    expected_external_research_required: true
    expected_response_action: ANSWER_WITH_TAX_REVIEW
    expected_material_differences:
      - "Source analyses the Canada-US treaty; question concerns Mexico"
      - "Source states the treaty mechanics are materially different and should not be cross-cited"
      - "Underlying Canada question is itself unresolved"

  # =======================================================================
  # NO_PRECEDENT -- validity_status must be null
  # =======================================================================

  - test_id: GS-N-001
    question: >-
      What is our position on Brazilian VAT on intercompany software licences?
    tags: [no_precedent, true-negative]
    notes: Nothing in the corpus touches Brazilian VAT or software licensing.
    expected_intent: HISTORICAL_PRECEDENT
    expected_source_ids: []
    expected_precedent_status: NO_PRECEDENT
    expected_validity_status: null
    expected_evidence_sufficiency: INSUFFICIENT
    expected_external_research_required: false
    expected_response_action: ABSTAIN
    expected_material_differences: []
    must_not_conclude: >-
      Must NOT reason from the Netherlands or Malaysia threads merely because
      they are also non-US.

  - test_id: GS-N-002
    question: >-
      Has Amsted analysed R&D credit eligibility for its foundry operations?
    tags: [no_precedent, cross-universe, critical]
    notes: >-
      CROSS-UNIVERSE TRAP. SRC-020 analyses R&D credit at Cascade Forge, which is
      a Northline entity, not Amsted. Retrieval will surface it on topic
      similarity. The precedent agent must recognise the entity mismatch and
      decline to treat it as Amsted precedent.
    expected_intent: HISTORICAL_PRECEDENT
    expected_source_ids: []
    expected_retrieval_may_include: ["SRC-020"]
    expected_precedent_status: NO_PRECEDENT
    expected_validity_status: null
    expected_evidence_sufficiency: INSUFFICIENT
    expected_response_action: ABSTAIN
    must_not_conclude: >-
      Must NOT present Cascade Forge / Northline analysis as Amsted precedent.

  - test_id: GS-N-003
    question: >-
      Where is the tax department shared drive located and when is the Q3 tax
      committee meeting?
    tags: [no_precedent, noise, administrative]
    notes: >-
      SRC-021 is deliberate noise. It is administrative content with no tax
      analysis. Retrieval may surface it; precedent analysis must return
      NO_PRECEDENT because there is no tax guidance to apply.
    expected_intent: SOURCE_LOOKUP
    expected_source_ids: []
    expected_retrieval_may_include: ["SRC-021"]
    expected_precedent_status: NO_PRECEDENT
    expected_validity_status: null
    expected_evidence_sufficiency: INSUFFICIENT
    expected_response_action: ABSTAIN

  - test_id: GS-N-004
    question: >-
      What did we conclude about Section 409(p) synthetic equity exposure for
      Amsted's ESOP?
    tags: [no_precedent, cross-universe, critical]
    notes: >-
      CROSS-UNIVERSE TRAP, hardest variant. SRC-002 is a detailed 409(p) analysis
      -- but for Northline. SRC-001 separately mentions that Amsted has S/ESOP
      status, which will pull both into retrieval. The two must not be merged
      into a fabricated Amsted 409(p) precedent.
    expected_intent: HISTORICAL_PRECEDENT
    expected_source_ids: []
    expected_retrieval_may_include: ["SRC-002", "SRC-001"]
    expected_precedent_status: NO_PRECEDENT
    expected_validity_status: null
    expected_evidence_sufficiency: INSUFFICIENT
    expected_response_action: ABSTAIN
    must_not_conclude: >-
      Must NOT attribute Northline's 409(p) thresholds, memo number, or committee
      vote to Amsted.

  # =======================================================================
  # VALIDITY -- SUPERSEDED
  # =======================================================================

  - test_id: GS-V-001
    question: >-
      What LTIP structure did we approve for 2024, and is the October draft
      analysis still good?
    tags: [superseded, equity-comp, northline, critical]
    notes: >-
      The clearest SUPERSEDED case available. SRC-002 states the October draft is
      'marked SUPERSEDED', that memo NIH-TAX-MEMO-2023-014 is final, and that the
      October conclusion 'was wrong' on the cash settlement point. Answering from
      the October draft is the exact failure the validity check exists to prevent.
    expected_intent: HISTORICAL_PRECEDENT
    expected_source_ids: ["SRC-002"]
    expected_precedent_status: MATCH
    expected_validity_status: SUPERSEDED
    expected_evidence_sufficiency: SUFFICIENT
    expected_external_research_required: false
    expected_response_action: ANSWER_WITH_TAX_REVIEW
    expected_answer_must_contain:
      - "NIH-TAX-MEMO-2023-014"
      - "SUPERSEDED"
    must_not_conclude: >-
      Must NOT present the October draft conclusion as current guidance.
    citation_validator_must_flag: superseded_source_misuse_if_october_draft_cited_as_current

  - test_id: GS-V-002
    question: >-
      Can we rely on cash settlement to keep phantom units outside the 409(p)
      synthetic equity definition?
    tags: [superseded, equity-comp, reversed-position, northline]
    notes: >-
      Tests reasoning over a corrected position. Counsel states the answer is no,
      citing Treas. Reg. 1.409(p)-1(f)(2)(iv), and identifies this as the reason
      the October draft conclusion was wrong. The final answer must reflect the
      corrected position, not the superseded one.
    expected_intent: HISTORICAL_PRECEDENT
    expected_source_ids: ["SRC-002"]
    expected_precedent_status: MATCH
    expected_validity_status: CURRENT
    expected_evidence_sufficiency: SUFFICIENT
    expected_response_action: ANSWER
    expected_answer_must_contain: ["cannot", "1.409(p)-1(f)(2)(iv)"]

  # =======================================================================
  # VALIDITY -- UNDER_REVIEW
  # =======================================================================

  - test_id: GS-U-001
    question: >-
      Did the on-site work in Canada create a services permanent establishment
      under the treaty?
    tags: [under_review, international, open-question, northline, critical]
    notes: >-
      SRC-010 is explicitly unresolved. Counsel presents two defensible day-count
      readings (well over 183 per-person-days vs about 98 enterprise-days), states
      CRA leans one way but that it is not free from doubt, and recommends a
      second opinion before taking a 2022 return position. Answering this as
      settled is a serious failure.
    expected_intent: HISTORICAL_PRECEDENT
    expected_source_ids: ["SRC-010"]
    expected_precedent_status: MATCH
    expected_validity_status: UNDER_REVIEW
    expected_evidence_sufficiency: INSUFFICIENT
    expected_external_research_required: false
    expected_response_action: ANSWER_WITH_TAX_REVIEW
    expected_answer_must_contain: ["Article V(9)", "183"]
    must_not_conclude: >-
      Must NOT state that a PE either exists or does not exist. The source
      reaches no conclusion.

  - test_id: GS-U-002
    question: >-
      Is BAC Malaysia compliant with Malaysian transfer pricing documentation
      requirements?
    tags: [under_review, transfer-pricing, open-question, amsted]
    notes: >-
      SRC-030 is an open inquiry. The local controller confirms TP documentation
      was not covered; several items are still being checked (Form C contemporaneous
      box for 2023-2025, CbCR notification section). No conclusion is reached.
    expected_intent: HISTORICAL_PRECEDENT
    expected_source_ids: ["SRC-030"]
    expected_precedent_status: MATCH
    expected_validity_status: UNDER_REVIEW
    expected_evidence_sufficiency: INSUFFICIENT
    expected_response_action: ANSWER_WITH_TAX_REVIEW
    expected_answer_must_contain: ["Local File", "not"]
    must_not_conclude: >-
      Must NOT state that BAC Malaysia is compliant.

  - test_id: GS-U-003
    question: >-
      Did we decide to grant the SARs awards to the two Netherlands employees?
    tags: [under_review, equity-comp, open-question, amsted]
    notes: >-
      SRC-031 ends unresolved: Total Rewards states they are 'not moving forward
      with granting awards without further understanding how it would work' and
      whether administration is worth the effort.
    expected_intent: HISTORICAL_PRECEDENT
    expected_source_ids: ["SRC-031"]
    expected_precedent_status: MATCH
    expected_validity_status: UNDER_REVIEW
    expected_evidence_sufficiency: INSUFFICIENT
    expected_response_action: ANSWER_WITH_TAX_REVIEW
    must_not_conclude: >-
      Must NOT state that the awards were approved or granted.

  # =======================================================================
  # VALIDITY -- UNKNOWN (the false-CURRENT guard)
  # =======================================================================

  - test_id: GS-K-001
    question: >-
      Is the group-wide nexus concern from the ADS Transquip discussion still
      Amsted's current position?
    tags: [unknown, false-current-guard, amsted, critical]
    notes: >-
      DIRECT FALSE-CURRENT TEST. SRC-001 is from February 2021 and nothing in the
      corpus confirms or updates it. The correct answer is UNKNOWN. Returning
      CURRENT here -- on the reasoning that nothing newer was found -- is the
      single highest-risk failure mode in the system and is blocked at the model
      layer by the absence-reasoning validator.
    expected_intent: MIXED_RESEARCH
    expected_source_ids: ["SRC-001"]
    expected_precedent_status: MATCH
    expected_validity_status: UNKNOWN
    expected_evidence_sufficiency: INSUFFICIENT_FOR_CURRENT_CONCLUSION
    expected_external_research_required: true
    expected_response_action: ANSWER_WITH_TAX_REVIEW
    validity_rationale_must_reference: >-
      Corpus contains no evidence affirmatively confirming continued
      applicability. UNKNOWN, not CURRENT.
    must_not_conclude: >-
      Must NOT justify CURRENT on the basis that no newer source was retrieved.

  - test_id: GS-K-002
    question: >-
      Is the Illinois voluntary disclosure for Meridian Bearing complete?
    tags: [unknown, salt, status-question, northline]
    notes: >-
      SRC-005 records the decision to pursue voluntary disclosure and the
      estimated exposure, but says nothing about completion. Evidence of a
      decision is not evidence of an outcome.
    expected_intent: HISTORICAL_PRECEDENT
    expected_source_ids: ["SRC-005"]
    expected_precedent_status: PARTIAL_MATCH
    expected_validity_status: UNKNOWN
    expected_evidence_sufficiency: INSUFFICIENT
    expected_response_action: ANSWER_WITH_TAX_REVIEW
    expected_material_differences:
      - "Source records the decision to disclose, not the completion of disclosure"

  # =======================================================================
  # MIXED_RESEARCH -- external authority required
  # =======================================================================

  - test_id: GS-X-001
    question: >-
      We concluded Illinois nexus in 2021 based on P.L. 86-272. Is that still
      consistent with current Illinois guidance?
    tags: [mixed_research, external-required, salt, northline]
    notes: >-
      Tests the external-research branch and, critically, that internal Amsted /
      Northline precedent stays structurally separate from external authority in
      synthesis and in the UI.
    expected_intent: MIXED_RESEARCH
    expected_source_ids: ["SRC-005"]
    expected_precedent_status: MATCH
    expected_validity_status: UNKNOWN
    expected_evidence_sufficiency: INSUFFICIENT_FOR_CURRENT_CONCLUSION
    expected_external_research_required: true
    expected_response_action: ANSWER_WITH_TAX_REVIEW
    expected_synthesis_sections: [historical_guidance, external_research_summary]
    must_not_conclude: >-
      Must NOT present external authority as internal precedent, or vice versa.

  # =======================================================================
  # SOURCE_LOOKUP / provenance
  # =======================================================================

  - test_id: GS-S-001
    question: "Find the final Illinois nexus position for Meridian Bearing."
    tags: [source_lookup, provenance]
    expected_intent: SOURCE_LOOKUP
    expected_source_ids: ["SRC-005"]
    expected_precedent_status: MATCH
    expected_validity_status: CURRENT
    expected_response_action: ANSWER
    expected_provenance_fields: [source_id, source_file, message_id, sender, sent_date]

  - test_id: GS-S-002
    question: >-
      Which email thread discusses Regulation 105 withholding for Northline
      Canada ULC?
    tags: [source_lookup, provenance, email-threading]
    notes: >-
      Provenance check on a multi-message thread. Citations must resolve to a
      specific message with sender and date, not merely the file.
    expected_intent: SOURCE_LOOKUP
    expected_source_ids: ["SRC-010"]
    expected_response_action: ANSWER
    expected_provenance_fields: [source_id, message_id, sender, sent_date]

  - test_id: GS-S-003
    question: >-
      What did Marilyn Franson write about Malaysian transfer pricing
      documentation deadlines?
    tags: [source_lookup, provenance, pdf-page]
    notes: >-
      Provenance check on a PDF-sourced chunk. Citations must carry a page
      number or they degrade to a bare filename.
    expected_intent: SOURCE_LOOKUP
    expected_source_ids: ["SRC-030"]
    expected_response_action: ANSWER_WITH_TAX_REVIEW
    expected_provenance_fields: [source_id, source_file, page_number]

  # =======================================================================
  # CONFLICTING EVIDENCE
  # =======================================================================

  - test_id: GS-C-001
    question: >-
      Does on-site service work by our technicians create tax exposure in a
      jurisdiction where we otherwise have no presence?
    tags: [conflicting, multi-source, salt, cross-universe]
    notes: >-
      Deliberately broad. Should retrieve SRC-001 (Amsted, group-wide nexus),
      SRC-005 (Northline, Illinois P.L. 86-272) and possibly SRC-010 (Canada
      services PE). All three address on-site service creating exposure, but
      across two entity groups and three regimes. The agent must surface them as
      related-but-distinct rather than merging them into one position.
    expected_intent: CURRENT_TAX_QUESTION
    expected_source_ids: ["SRC-001", "SRC-005"]
    expected_min_distinct_sources: 2
    expected_precedent_status: PARTIAL_MATCH
    expected_validity_status: UNKNOWN
    expected_evidence_sufficiency: CONFLICTING
    expected_external_research_required: true
    expected_response_action: ANSWER_WITH_TAX_REVIEW
    expected_material_differences:
      - "Sources span two unrelated corporate groups"
      - "Different regimes: US state/local income tax nexus vs Canadian treaty services PE"
    must_not_conclude: >-
      Must NOT merge Amsted and Northline conclusions into a single position.

  # =======================================================================
  # CLARIFICATION
  # =======================================================================

  - test_id: GS-Q-001
    question: "Do we have a problem with the service techs?"
    tags: [clarification, underspecified]
    notes: >-
      Underspecified on entity, jurisdiction and tax type. Should request
      clarification rather than guessing which of two corporate groups is meant.
    expected_intent: CLARIFICATION
    expected_source_ids: []
    expected_precedent_status: null
    expected_validity_status: null
    expected_response_action: ABSTAIN
    expected_clarification_must_reference: [entity, jurisdiction]
