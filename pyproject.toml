[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "amsted-tax-ingestion"
version = "0.1.0"
description = "Local-first ingestion pipeline for the Amsted AI Tax Agent"
requires-python = ">=3.11"
dependencies = [
  "azure-storage-blob>=12.20,<13", "azure-data-tables>=12.5,<13",
  "azure-search-documents>=11.6.0b8,<12", "openai>=1.40,<2",
  "pydantic>=2.7,<3", "pydantic-settings>=2.3,<3", "python-dotenv>=1.0,<2",
  "docling>=2.0,<3", "extract-msg>=0.48,<1", "beautifulsoup4>=4.12,<5",
  "python-docx>=1.1,<2", "python-pptx>=1.0,<2", "openpyxl>=3.1,<4",
  "pandas>=2.2,<3", "tiktoken>=0.7,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<6", "ruff>=0.6,<1"]
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
markers=["integration: requires live Azure services"]
pythonpath=["src"]
[tool.ruff]
line-length=100
