[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amsted-tax-agent"
version = "0.1.0"
description = "AI Tax Agent for Amsted Industries — ingestion pipeline and evidence-grounded retrieval runtime"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]

ingestion = [
    "azure-storage-blob>=12.20,<13",
    "azure-data-tables>=12.5,<13",
    "azure-search-documents>=11.6.0b8,<12",
    "azure-identity>=1.17,<2",
    "openai>=1.40,<2",
    "docling>=2.0,<3",
    "extract-msg>=0.48,<1",
    "beautifulsoup4>=4.12,<5",
    "python-docx>=1.1,<2",
    "python-pptx>=1.0,<2",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "tiktoken>=0.7,<1",
    "pdfplumber>=0.11.0",
    "pymupdf>=1.24.0",
]

# Installed into the Container Apps image only. Deliberately excludes
# docling, pandas, and the document-parsing stack above — the runtime
# never touches raw source files, only the already-populated Azure AI
# Search index.
runtime = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "azure-search-documents>=11.6.0b8,<12",
    "azure-identity>=1.17,<2",
    "aiohttp>=3.9,<4",
    "openai>=1.40,<2",
    "pyyaml>=6.0,<7",
    "tenacity>=8.2,<9",
]

dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.6,<1",
    "pyyaml>=6.0,<7",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["amsted_tax_ingestion*", "runtime*", "shared*"]
exclude = ["eval*", "*.tests", "*.tests.*", "tests*"]

[tool.pytest.ini_options]
markers = ["integration: requires live Azure services"]
testpaths = ["runtime/tests", "src/amsted_tax_ingestion/tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100